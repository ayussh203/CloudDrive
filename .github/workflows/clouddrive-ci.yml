name: CloudDrive Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'backend/clouddrive/clouddrive/**'
      - '.github/workflows/clouddrive-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/clouddrive/clouddrive/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/clouddrive/clouddrive

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build (skip tests)
        run: mvn -q -DskipTests package

      - name: Run tests
        run: mvn -q test
      
      - name: Upload built JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: clouddrive-backend-jar
          path: backend/clouddrive/clouddrive/target/clouddrive-*.jar