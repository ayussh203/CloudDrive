server:
  port: 8080

spring:
  application:
    name: clouddrive
  datasource:
    url: jdbc:h2:mem:clouddrive;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: "health,info"

app:
  jwt:
    secret: "dev-change-me-please-32+chars-long"
    ttlMinutes: 60
