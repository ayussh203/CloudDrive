server:
  port: ${PORT:5000}

spring:
  application:
    name: clouddrive
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://clouddrive-db-public.czio2aggmdzt.ap-south-1.rds.amazonaws.com:5432/clouddrive}
    username: ${SPRING_DATASOURCE_USERNAME:cloudadmin}
    password: ${SPRING_DATASOURCE_PASSWORD:CloudDriveP#ss123!}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: "health,info"

app:
  jwt:
    secret: ${APP_JWT_SECRET:dev-change-me-please-32+chars-long}
    ttlMinutes: ${APP_JWT_TTLMINUTES:60}
  s3:
    bucket: ${APP_S3_BUCKET:clouddrive-dev-ayush}
    region: ${APP_S3_REGION:ap-south-1}
